services:
  navadav_cms_app:
    image: navadav_cms
    build: .
    container_name: navadav_cms_app
    ports:
      - "5000:80"
    environment:
      - URLS__BASEURL=http://localhost:5000/
      - EVENTSTORE__TYPE=MongoDb
      - EVENTSTORE__MONGODB__CONFIGURATION=mongodb://navadav_cms_mongo:27017
      - STORE__MONGODB__CONFIGURATION=mongodb://navadav_cms_mongo:27017
      - ASPNETCORE_HTTP_PORTS=80
    depends_on:
      - navadav_cms_mongo
    volumes:
      - navadav_cms_assets:/app/Assets
    restart: unless-stopped

  navadav_cms_mongo:
    image: mongo:6.0 # Usa la versión de MongoDB compatible con tu proyecto
    container_name: navadav_cms_mongo
    ports:
      - "27018:27017" # Se cambió el puerto externo a 27018 para evitar conflictos
    volumes:
      # AQUÍ ESTÁ LA PERSISTENCIA DE DATOS EN UN VOLUMEN SEPARADO:
      - navadav_cms_db_data:/data/db
    restart: unless-stopped

# Declaración de volúmenes persistentes
volumes:
  navadav_cms_db_data:
    name: navadav_cms_db_data
  navadav_cms_assets:
    name: navadav_cms_assets
